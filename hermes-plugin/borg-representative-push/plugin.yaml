name: borg-representative-push
version: 2.0.0
manifest_version: 2
api_version: 1
description: >-
  Wakes one Hermes gateway conversation when the bound Borg Coordinator replies
  to the human representative. Runs `borg representative listen --protocol 2`
  inside the messaging gateway, injects a fixed, body-free prompt for each wake
  and reports whether Hermes accepted it; Borg decides every wake. Reply content
  is only ever fetched by the conversation through borg_representative-read.
license: Apache-2.0
homepage: https://github.com/Byte-Ventures/borg-mcp-client
tags: [borg, gateway, representative]
config_schema:
  session_key:
    type: str
    required: true
    description: Gateway session key of the conversation to wake, e.g. agent:main:telegram:dm:<chat id>.
  worktree:
    type: str
    required: true
    description: Absolute path of the prepared representative worktree.
  borg_command:
    type: str
    default: borg
    description: The borg executable (borgmcp >= 6.0.0).
