name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: release policy (24)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Test release policy
        run: |
          node --test test/release-lane.test.mjs

  client:
    name: client source (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0', '24.19.0']
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        if: matrix.node-version == '24.19.0'
        run: npm audit --audit-level=high

      - name: Check source types
        if: matrix.node-version == '24.19.0'
        run: npm run check

      - name: Run unit tests
        run: timeout 5m npm run test:unit

      - name: Build readable artifacts
        if: matrix.node-version == '24.19.0'
        run: npm run build

      - name: Exercise onboarding
        if: matrix.node-version == '24.19.0'
        run: npm run onboarding:smoke

      - name: Verify installed package artifact
        if: matrix.node-version == '24.19.0'
        run: npm run verify:package
